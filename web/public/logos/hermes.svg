<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hermes-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" fill="url(#hermes-gradient)" opacity="0.15"/>
  <!-- Main symbol - stylized H with wings/messenger motif -->
  <g transform="translate(256, 256)">
    <!-- Wings -->
    <path d="M-80 0 Q-120 -40 -100 -80 Q-80 -100 -40 -80 Q-20 -60 0 0 Q20 -60 40 -80 Q80 -100 100 -80 Q120 -40 80 0" fill="url(#hermes-gradient)" opacity="0.9"/>
    <!-- Central pillar -->
    <rect x="-24" y="-100" width="48" height="200" rx="12" fill="url(#hermes-gradient)"/>
    <!-- Cross bars -->
    <rect x="-60" y="-20" width="120" height="16" rx="8" fill="url(#hermes-gradient)"/>
    <rect x="-40" y="40" width="80" height="16" rx="8" fill="url(#hermes-gradient)"/>
    <!-- Inner glow accent -->
    <circle cx="0" cy="-10" r="16" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Small decorative dots -->
  <g fill="#6366f1" opacity="0.6">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="432" cy="432" r="4"/>
    <circle cx="80" cy="432" r="3"/>
    <circle cx="432" cy="80" r="3"/>
  </g>
</svg>