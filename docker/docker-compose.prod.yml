version: '3.8'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: svcmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-svcmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svcmarket} -d ${POSTGRES_DB:-service_marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - svcmarket-network

  # ─────────────────────────────────────────────
  # Redis (Cache + BullMQ)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: svcmarket-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - svcmarket-network

  # ─────────────────────────────────────────────
  # Service Marketplace API (Fastify)
  # ─────────────────────────────────────────────
  server:
    image: docker.io/okongzinc/service-marketplace-api:latest
    container_name: svcmarket-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-svcmarket}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-service_marketplace}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      DOCKER_HOST: unix:///var/run/docker.sock
      LOG_LEVEL: info
      CATALOG_PATH: /app/catalog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - catalog_data:/app/catalog
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - svcmarket-network

  # ─────────────────────────────────────────────
  # Traefik Reverse Proxy (Auto TLS)
  # ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: svcmarket-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - svcmarket-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # ─────────────────────────────────────────────
  # Frontend (served via Traefik or standalone)
  # ─────────────────────────────────────────────
  # Uncomment if you want to host frontend on same VPS
  # web:
  #   image: nginx:alpine
  #   container_name: svcmarket-web
  #   restart: unless-stopped
  #   volumes:
  #     - ./web/dist:/usr/share/nginx/html:ro
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - svcmarket-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
  #     - "traefik.http.routers.web.entrypoints=websecure"
  #     - "traefik.http.routers.web.tls.certresolver=letsencrypt"

volumes:
  postgres_data:
  redis_data:
  catalog_data:
  letsencrypt_data:

networks:
  svcmarket-network:
    driver: bridge