version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: svcmarket-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: svcmarket
      POSTGRES_USER: svcmarket
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svcmarket -d svcmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: svcmarket-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass dev_password
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Development API with hot reload
  api-dev:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: builder
    container_name: svcmarket-api-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://svcmarket:dev_password@postgres:5432/svcmarket?schema=public
      REDIS_URL: redis://:dev_password@redis:6379
      JWT_SECRET: dev_jwt_secret_key_at_least_32_chars_long
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: dev_refresh_secret_key_at_least_32_chars_long
      REFRESH_TOKEN_EXPIRES_IN: 30d
      DOCKER_HOST: unix:///var/run/docker.sock
      CATALOG_PATH: /app/catalog
      LOG_LEVEL: debug
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ../server:/app
      - /app/node_modules
      - /app/dist
      - ../shared/catalog-examples:/app/catalog:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm dev

  # Development Web with hot reload
  web-dev:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: builder
    container_name: svcmarket-web-dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_APP_NAME: Service Marketplace (Dev)
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "5173:5173"
    command: pnpm dev

  # Development Worker
  worker-dev:
    build:
      context: ../worker
      dockerfile: Dockerfile
      target: builder
    container_name: svcmarket-worker-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://svcmarket:dev_password@postgres:5432/svcmarket?schema=public
      REDIS_URL: redis://:dev_password@redis:6379
      DOCKER_HOST: unix:///var/run/docker.sock
      LOG_LEVEL: debug
    volumes:
      - ../worker:/app
      - /app/node_modules
      - /app/dist
      - ../shared/catalog-examples:/app/catalog:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm dev

networks:
  default:
    name: svcmarket-dev

volumes:
  postgres_dev_data:
  redis_dev_data: