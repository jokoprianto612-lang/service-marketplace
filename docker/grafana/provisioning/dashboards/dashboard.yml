# ─────────────────────────────────────────────
# Grafana Dashboard Provisioning
# ─────────────────────────────────────────────
apiVersion: 1

providers:
  - name: 'Service Marketplace'
    orgId: 1
    folder: 'Service Marketplace'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards